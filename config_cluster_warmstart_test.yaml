evolution:
  bulk_assign_prob: 0.04
  cluster_app_prob: 0.2
  cluster_score_tolerance: 0.2
  crossover_prob: 0.7
  effort_swap_prob: 0.06
  group_overwrite_prob: 0.15
  inject_seed: true
  l7_access_prob: 0.03
  mouse_workflow_prob: 0.06
  mutation_prob: 0.2
  n_generations: 500000
  optional_arrow_drop_prob: 0.0
  pop_size: 1500
  random_assign_prob: 0.08
  seed: 42
  smart_duplicate_prob: 0.2
exact_eval:
  batch_size: 100
  parity_samples: 16
  parity_tolerance: 1e-4
  validate_parity: false
fitness:
  hard_constraints:
  - missing_important
  - layer7_access
  - natural_mouse_layer_exists
  - layer_reachability
  - toggle_back_to_l0
  - same_layer_duplicate
  missing_important_threshold: 6.0
  semantic_cluster_multiplier: 200.0
  semantic_cluster_multiplier_schedule:
  - - 0
    - 200.0
  - - 750
    - 400.0
  - - 1500
    - 600.0
  semantic_cluster_pair_boost: 250000.0
  shortcut_importance_overrides:
    Ctrl+A: 6.0
    Ctrl+S: 14.0
    Ctrl+Y: 12.0
    DownArrow: 4.0
    LeftArrow: 4.0
    RightArrow: 4.0
    Shift+Enter: 9.5
    UpArrow: 4.0
    Win+S: 12.0
  toggle_effort_multiplier: 4.0
  violation_sub_weights:
    access_layout: 5000.0
    arrow_order: 0.0
    arrow_scattered: 0.0
    cross_layer_duplicate: 40000.0
    duplicate: 35.0
    duplicate_value_gap: 45000.0
    dynamic_mouse_layer: 5000000000.0
    empty_position: 200.0
    group_split: 2000000.0
    hand_bias: 25000.0
    l0_displacement: 50.0
    layer7_access: 50000.0
    layer_depth_penalty: 3000000000.0
    layer_reachability: 50000.0
    missing_important: 500.0
    mouse_hold_position_conflict: 150000000000.0
    mouse_layer_access: 5000000.0
    mouse_layer_depth_penalty: 150000000000.0
    mouse_scattered: 500000.0
    natural_mouse_layer_exists: 200000000000.0
    raw_keyboard_completion_norwegian: 80000.0
    same_layer_duplicate: 200000.0
    thumb_occupancy: 30000.0
    toggle_back_to_l0: 150000000000.0
  weights:
    adjacency: 1.5
    app_coherence: 5.0
    effort: 8.0
    everything_layer: 4.0
    familiarity: 6.0
    finger_balance: 0.8
    layer_similarity: 4.0
    same_finger: 2.0
    trackball_proximity: 5.0
    violations: 120.0
    workflow_coherence: 30.0
output:
  checkpoint_interval: 500
  verbose: true
surrogate:
  batch_size: 8192
  embedding_dim: 32
  enabled: true
  exact_eval_every: 300
  hidden_dim: 256
  initial_exact_samples: 5000
  max_retrain_samples: 9000
  mini_eval_fraction: 0.1
  retrain_epochs: 40
  retrain_every: 300
  train_epochs: 100
training:
  allow_cpu_exact_validation: false
  require_cuda: true
  require_gpu_primary: true
