evolution:
  pop_size: 1500            # was 900; more diversity, more GPU work per predict batch
  # 500000 is a ceiling for explicit overnight/extreme runs only, NOT the
  # target. Normal runs target ~30000 gens -- see AGENTS.md "Normal Run
  # Length Is 30,000 Generations, Not 500,000". Judge run health/progress
  # against 30000, never against this ceiling.
  n_generations: 500000
  crossover_prob: 0.7
  mutation_prob: 0.2
  group_overwrite_prob: 0.15
  mouse_workflow_prob: 0.06
  l7_access_prob: 0.03
  random_assign_prob: 0.08
  bulk_assign_prob: 0.04
  optional_arrow_drop_prob: 0.04
  cluster_app_prob: 0.20
  effort_swap_prob: 0.06
  smart_duplicate_prob: 0.20
  seed: 42
  inject_seed: true
surrogate:
  enabled: true
  initial_exact_samples: 5000   # bootstrap; gets washed out by mini-evals quickly
  exact_eval_every: 300         # full-pop exact eval still runs periodically
  retrain_every: 300
  train_epochs: 100
  retrain_epochs: 40
  batch_size: 8192               # large batches saturate GTX 1070 compute
  max_retrain_samples: 9000      # keep only recent 9000 samples → local surrogate, higher R²
  hidden_dim: 256
  embedding_dim: 32
  mini_eval_fraction: 0.1        # fraction of children exact-evaluated each generation
training:
  require_cuda: true
  require_gpu_primary: true
  allow_cpu_exact_validation: false
exact_eval:
  batch_size: 100                # exact-eval batch size
  validate_parity: false
  parity_samples: 16
  parity_tolerance: 1e-4
fitness:
  weights:
    effort: 8.0
    adjacency: 1.5
    finger_balance: 0.8
    same_finger: 2.0
    violations: 120.0
    workflow_coherence: 20.0
    trackball_proximity: 5.0
    app_coherence: 5.0
    familiarity: 6.0
    layer_similarity: 4.0
    everything_layer: 4.0
  shortcut_importance_overrides:
    Win+S: 12.0
    LeftArrow: 4.0
    RightArrow: 4.0
    UpArrow: 4.0
    DownArrow: 4.0
    # Ctrl+S: 0.95 default (raw stats miss saves — boosted to match real use)
    Ctrl+S: 14.0
    # Ctrl+Y/A: low defaults, boosted to reflect real-world frequency
    Ctrl+A: 6.0
    Ctrl+Y: 12.0
    # Shift+Enter: 99 uses/day (most-used non-frozen layer shortcut) — 6.0 default is too low
    Shift+Enter: 9.5
    # Ctrl+C: 52/day but only eff=1.00; same importance as Ctrl+V which is at eff=0.00
    # Keep at 10.0 (already set by app data) — optimizer needs to find it a home-row slot
    # Scroll: no L10 hardcode — kernel tracks scroll_right_momentary dynamically by placement layer.
    # Effort penalty (coeff 15000) pushes whichever scroll key lands on the mouse layer to eff=0.
  missing_important_threshold: 6.0
  toggle_effort_multiplier: 4.0
  violation_sub_weights:
    duplicate: 35.0
    l0_displacement: 50.0
    # Recalibrated 2026-07-13 (corrected zero-others methodology): this is one
    # of the 6 hard-constraint-driving terms (missing_important,
    # layer7_access, natural_mouse_layer_exists, layer_reachability,
    # toggle_back_to_l0, same_layer_duplicate) but was left at 500 while its
    # siblings sit at 50000-200000 -- brought in line with that tier.
    missing_important: 200000.0
    cross_layer_duplicate: 40000.0
    group_split: 200.0
    thumb_occupancy: 50000.0
    arrow_order: 10000.0
    hand_bias: 25000.0
    # Recalibrated 2026-07-13: formula (fitness/kernel.py ~1087) is a simple
    # per-occurrence penalty (imp * 100.0), structurally identical to
    # thumb_occupancy/l0_displacement -- not an internally pre-scaled sum.
    # At 5000000 (100x its logical tier), a single occurrence would
    # contribute ~2.5e9-2e10, the same swamping magnitude found and fixed for
    # momentary_key_reuse in this same sweep. Neither checkpoint measured
    # this session currently violates this term (so its true live
    # contribution couldn't be directly re-verified the way the other fixes
    # were), but the weight was clearly never calibrated against this
    # formula's actual scale -- brought down to the matching soft-pressure
    # tier now, re-verify empirically the next time a genome actually
    # violates it.
    mouse_layer_access: 50000.0
    # Recalibrated 2026-07-13: this term's raw value is already an internal
    # sum of several sub-penalties pre-scaled to the thousands/tens-of-
    # thousands (fitness/kernel.py's arrow_scattered block), the same pattern
    # as dynamic_mouse_layer/raw_keyboard_completion_norwegian below -- not a
    # simple violation count. Measured on a real checkpoint at the old weight
    # (50000): contributed 4.0e8, comparable in scale to the other swamping
    # terms fixed in this same sweep. Brought down so its contribution lands
    # in the same tier as an uninvolved reference term (hand_bias).
    arrow_scattered: 400.0
    mouse_scattered: 500.0
    layer7_access: 50000.0
    duplicate_value_gap: 45000.0
    access_layout: 5000.0
    # Recalibrated 2026-07-13: these two terms are continuous quality/
    # refinement scores whose raw value is already an internal sum of many
    # kernel-side sub-penalties (each already scaled to the tens of
    # thousands, e.g. dynamic_mouse_layer's per-button ideal-position terms
    # in fitness/kernel.py), not a simple violation count like most other
    # terms here. Measured directly: their raw magnitude (~62600 and
    # ~146300 respectively) was ~400-1000x larger than a typical
    # violation-count term's raw magnitude (thumb_occupancy: ~144), so their
    # old outer weights (80000/500000) compounded into contributions 7000x+
    # larger than every count-based soft-pressure term combined, swamping
    # the whole viol axis. Brought down so their contribution lands in the
    # same tier as hand_bias (a term not implicated in this investigation).
    raw_keyboard_completion_norwegian: 20.0
    dynamic_mouse_layer: 50.0
    empty_position: 200.0
    layer_reachability: 50000.0
    # Recalibrated 2026-07-13: measured directly against a real gen-30000
    # checkpoint using the corrected zero-others methodology (see
    # AGENTS.md/momentary_key_reuse for why this is the only valid method).
    # At 3e9, this term alone produced a raw viol contribution ~250x larger
    # than every other active soft-pressure term combined in that checkpoint
    # (thumb_occupancy, hand_bias, arrow_order, access_layout, group_split,
    # empty_position) -- not because the genome's actual depth-penalty
    # magnitude was unusually large (it measured comparable to
    # thumb_occupancy's own raw magnitude), but purely because of this
    # weight. That swamped the entire shared violations axis, making every
    # other soft-pressure term's calibration irrelevant regardless of its own
    # weight -- confirmed to be why raising thumb_occupancy alone (even 20x)
    # produced no measurable change in total_score. Brought down to the same
    # tier as its layer-structure siblings (layer7_access/layer_reachability).
    layer_depth_penalty: 50000.0
    natural_mouse_layer_exists: 200000
    # Recalibrated 2026-07-13: these three terms shared the identical
    # placeholder value 150000000000.0 (1.5e11) -- an obvious copy-paste/
    # arbitrary-huge-number artifact, not a calibrated value, and 750x larger
    # than layer_depth_penalty even before that term's own fix above.
    # toggle_back_to_l0 is a hard-constraint-driving term -- matched to that
    # tier (natural_mouse_layer_exists/same_layer_duplicate). The other two
    # are soft, repair-eligible position conflicts -- matched to the
    # layer7_access/layer_reachability tier.
    toggle_back_to_l0: 200000.0
    mouse_hold_position_conflict: 50000.0
    mouse_layer_depth_penalty: 50000.0
    same_layer_duplicate: 200000.0
    # Soft pressure only (not a hard constraint, matching every other
    # UX-quality rule in this file): discourages one physical key acting as a
    # momentary-hold source for different target layers depending on which
    # layer is currently active, distinct from layer_depth_penalty's purely
    # economic hop-depth cost.
    #
    # History: 40000.0 (original guess) measured too weak (~0.003% of viol
    # budget), raised to 5e7, still too weak (~2.2%), raised again to 5e8 as
    # a "second empirical A/B test" -- but that escalation was validated only
    # by checking that the reused-key COUNT dropped, never by checking this
    # term's actual weighted CONTRIBUTION relative to every other term. Real
    # bug found 2026-07-13 (zero-others methodology against a live archive
    # checkpoint): at 5e8, this term contributed 4.085e10 -- 175x larger than
    # every other active violation term COMBINED on that same genome (next
    # largest: layer_depth_penalty at 2.3e8) -- the exact same
    # weight-swamping bug already found and fixed this session for
    # layer_depth_penalty/toggle_back_to_l0/dynamic_mouse_layer/
    # raw_keyboard_completion_norwegian, just undiscovered until a repo-wide
    # re-sweep. The escalate-until-count-drops methodology never checks for
    # this failure mode, since a term swamping the whole axis will *always*
    # look like it's "working" (it dominates whatever it touches) even when
    # it has made every other term's calibration meaningless. Raw magnitude
    # here is modest (~82, comparable to thumb_occupancy's ~144) -- brought
    # down to the same soft-pressure tier (50000) as its listed siblings.
    momentary_key_reuse: 50000.0
    # Full weight-magnitude audit (2026-07-12, "nuclear pass"): every
    # violation_sub_weights entry was measured against a real checkpoint
    # (gen 7500, v2_momentary_reuse_mutfix_20260712) using a
    # contamination-cancelling method (isolate raw_scores[term] via
    # violations-only weights with the target term at 1.0 vs a same-setup
    # all-zero baseline, then subtract -- the earlier float32-cancellation
    # bug this session found does NOT reappear here because the constant
    # mouse_effective_access/mouse_workflow contamination is identical in
    # both measurements and cancels exactly). Findings: layer_depth_penalty
    # (~6.7% of viol budget) and momentary_key_reuse (~4.4%) dominate as
    # intended. Every other term was either exactly zero (a genuinely
    # satisfied hard constraint on this feasible checkpoint -- correct, not
    # a bug) or a small-but-real nonzero residual (raw_keyboard_completion_norwegian
    # ~0.06%, dynamic_mouse_layer ~0.12%, arrow_scattered ~0.002%, etc.).
    # None showed the "1000-2500x too weak to ever matter" signature the
    # original momentary_key_reuse guess had. No other weight changed as a
    # result: the small-residual terms above now have dedicated constructive/
    # repair mutation operators (evolution/__init__.py's
    # _numba_propose_arrow_cluster, _numba_propose_raw_completion_cluster,
    # _numba_repair_mouse_hold_conflict, _numba_repair_thumb_occupancy, plus
    # the extended _numba_bias_access_to_thumb) that construct the fix
    # directly rather than needing strong gradient pressure to stumble onto
    # it by chance, so their current weights are enough to make an accepted
    # improving move once one is proposed.
  hard_constraints:
    - missing_important
    - layer7_access
    - natural_mouse_layer_exists
    - layer_reachability
    - toggle_back_to_l0
    - same_layer_duplicate
output:
  checkpoint_interval: 500
  verbose: true
