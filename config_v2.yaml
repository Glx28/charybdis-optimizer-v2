evolution:
  pop_size: 1500            # was 900; more diversity, more GPU work per predict batch
  # Ceiling for explicit overnight/extreme runs only; normal target is
  # ~30000 gens (see AGENTS.md "Normal Run Length").
  n_generations: 500000
  crossover_prob: 0.7
  mutation_prob: 0.2
  group_overwrite_prob: 0.15
  mouse_workflow_prob: 0.06
  l7_access_prob: 0.03
  random_assign_prob: 0.08
  bulk_assign_prob: 0.04
  optional_arrow_drop_prob: 0.04
  cluster_app_prob: 0.20
  effort_swap_prob: 0.06
  smart_duplicate_prob: 0.20
  access_thumb_bias_prob: 0.15       # bias layer-access keys toward thumb positions
  return_toggle_repair_prob: 0.10    # repair missing return-to-L0 toggles
  toggle_own_layer_bias_prob: 0.12   # bias a layer's toggle onto that layer itself
  momentary_reuse_repair_prob: 0.10  # repair momentary_key_reuse conflicts
  arrow_cluster_prob: 0.06           # constructive arrow-cluster move
  raw_completion_cluster_prob: 0.06  # constructive Norwegian/raw-completion cluster move
  mouse_hold_conflict_repair_prob: 0.05    # repair mouse_hold_position_conflict
  thumb_occupancy_repair_prob: 0.05        # repair restricted-thumb occupancy
  same_layer_duplicate_repair_prob: 0.05   # repair same-layer duplicates (hard constraint)
  l0_hold_completion_prob: 0.08            # repair L0 toggle-without-hold penalty
  unsupported_duplicate_repair_prob: 0.05  # blank extra copies of evidence-backed support<0.25 duplicates
  feasibility_first_selection: true        # Deb (2000) feasibility rules in tournament selection
  seed: 42
  inject_seed: true
surrogate:
  enabled: true
  initial_exact_samples: 5000   # bootstrap; gets washed out by mini-evals quickly
  exact_eval_every: 300         # full-pop exact eval still runs periodically
  retrain_every: 300
  train_epochs: 100
  retrain_epochs: 40
  batch_size: 8192               # large batches saturate GTX 1070 compute
  max_retrain_samples: 9000      # keep only recent 9000 samples → local surrogate, higher R²
  hidden_dim: 256
  embedding_dim: 32
  mini_eval_fraction: 0.1        # fraction of children exact-evaluated each generation
training:
  require_cuda: true
  require_gpu_primary: true
  allow_cpu_exact_validation: false
exact_eval:
  batch_size: 100                # exact-eval batch size
  validate_parity: false
  parity_samples: 16
  parity_tolerance: 1e-4
fitness:
  weights:
    effort: 8.0
    adjacency: 1.5
    finger_balance: 0.8
    same_finger: 2.0
    violations: 120.0
    workflow_coherence: 20.0
    trackball_proximity: 5.0
    app_coherence: 5.0
    familiarity: 6.0
    layer_similarity: 4.0
    everything_layer: 4.0
  shortcut_importance_overrides:
    Win+S: 12.0
    LeftArrow: 4.0
    RightArrow: 4.0
    UpArrow: 4.0
    DownArrow: 4.0
    # Ctrl+S: 0.95 default (raw stats miss saves — boosted to match real use)
    Ctrl+S: 14.0
    # Ctrl+Y/A: low defaults, boosted to reflect real-world frequency
    Ctrl+A: 6.0
    Ctrl+Y: 12.0
    # Shift+Enter: 99 uses/day (most-used non-frozen layer shortcut) — 6.0 default is too low
    Shift+Enter: 9.5
    # Ctrl+C: 52/day but only eff=1.00; same importance as Ctrl+V which is at eff=0.00
    # Keep at 10.0 (already set by app data) — optimizer needs to find it a home-row slot
    # Scroll: no L10 hardcode — kernel tracks scroll_right_momentary dynamically by placement layer.
    # Effort penalty (coeff 15000) pushes whichever scroll key lands on the mouse layer to eff=0.
  missing_important_threshold: 6.0
  toggle_effort_multiplier: 4.0
  violation_sub_weights:
    duplicate: 35.0
    l0_displacement: 50.0
    # Hard-constraint-driving term; tier-matched to its siblings (history: DECISION_LOG.md).
    missing_important: 200000.0
    cross_layer_duplicate: 40000.0
    group_split: 200.0
    thumb_occupancy: 50000.0
    arrow_order: 10000.0
    hand_bias: 25000.0
    # Simple per-occurrence penalty (imp * 100.0 in kernel); tier-matched to
    # soft-pressure siblings.
    mouse_layer_access: 50000.0
    # Raw value is a pre-scaled internal sum (kernel arrow_scattered block),
    # not a violation count; weighted to match the hand_bias tier.
    arrow_scattered: 400.0
    mouse_scattered: 500.0
    layer7_access: 50000.0
    duplicate_value_gap: 45000.0
    access_layout: 5000.0
    # Continuous quality/refinement scores whose raw values are pre-scaled
    # internal sums (kernel-side), not counts; low outer weights keep them in
    # the hand_bias tier (history: DECISION_LOG.md).
    raw_keyboard_completion_norwegian: 20.0
    dynamic_mouse_layer: 50.0
    empty_position: 200.0
    layer_reachability: 50000.0
    # Tier-matched to layer-structure siblings (layer7_access/layer_reachability)
    # after a weight-swamping fix (history: DECISION_LOG.md).
    layer_depth_penalty: 50000.0
    natural_mouse_layer_exists: 200000
    # toggle_back_to_l0 drives a hard constraint (200k tier); the other two
    # are soft, repair-eligible position conflicts (50k tier).
    toggle_back_to_l0: 200000.0
    mouse_hold_position_conflict: 50000.0
    mouse_layer_depth_penalty: 50000.0
    same_layer_duplicate: 200000.0
    # Soft learnability pressure: discourages one physical key acting as a
    # momentary-hold source for different target layers depending on the
    # active layer (see AGENTS.md momentary_key_reuse; history: DECISION_LOG.md).
    momentary_key_reuse: 50000.0
    # Hard-constraint tier: acceptance's unsupported_duplicates_near_zero class (history: DECISION_LOG.md).
    unsupported_duplicate: 200000.0
    # Hard-constraint tier: genuinely-restricted thumb occupancy only; toggle-freed effort-floor stays soft (history: DECISION_LOG.md).
    thumb_occupancy_restricted: 50000.0
    # Hard-constraint tier: acceptance's norwegian_completion_cluster check (history: DECISION_LOG.md).
    norwegian_completion_cluster: 200000.0
  hard_constraints:
    - missing_important
    - layer7_access
    - natural_mouse_layer_exists
    - layer_reachability
    - toggle_back_to_l0
    - same_layer_duplicate
    # Archive froze: these failed acceptance while staying invisible to Deb selection (history: DECISION_LOG.md).
    - unsupported_duplicate
    - thumb_occupancy_restricted
    - norwegian_completion_cluster
output:
  checkpoint_interval: 500
  verbose: true
